# PLEASE MEANUALLY SET UR DISPLAY RES HERE on WIDTH and HEIGHT
# FULLSCREEN : disabling it can lead to raw input and performance issue
# FPS_LIMIT : its recommended to let COSU run at no limit bcuz higher the fps the better its accuracy, the game runs best at over 1000fps
# VSYNC : just bcuz its here doent mean u should use it . it will make all motions look like shit and game runs inaccurately
# MOUSE_SENS : its not same equavlent sens as osu its depended on how raylib and SDL2 calcs its sens so u need to experiment around but you should start with ur real osu sens it might work idk . NOTE IT HAS TO BE FLOATING NUMBER , MEANING X.X like : 2.1 3.0 AND NOT just 3 or 3.2.1
# BG IMAGE : THIS HAS MASSIVE EFFECT ON PERFORMANCE (depending on system ), disabling can 3x ur FPS . since with image on it will cover entire screen it has to send more data to gpu thats why it gets slow.
# PLAYFILED : draws the cord map box thingy
# CURSOR_SIZE : i think 24.0 is 1 of real osu idk . and also this is floating too
# BILINEAR_FILTERING : dont turn off or else...everything will look like shit
# HI-RES_SKING : also will become shit and broken dont turn off...i shouldnt even have this as option for now tbh
# SKIN : this will change ur skin. put yo skin in ./Skins/ and rename it to a simple name with no spaces
# MAP : changes map and map list is in ./Songs/ and if u want to use custom map read the guide there
